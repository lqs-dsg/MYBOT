[project]
name = "mybot"
version = "0.1.0"
description = "A personal AI agent - built from scratch"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "openai>=2.8.0",
    "loguru>=0.7.3,<1.0.0",
    "typer>=0.20.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mybot = "mybot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mybot"]
