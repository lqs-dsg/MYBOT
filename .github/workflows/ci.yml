name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # Windows runner 默认编码不是 UTF-8，输出中文会 UnicodeEncodeError
  PYTHONIOENCODING: utf-8

jobs:
  test:
    # 用 windows 跑：本项目在 Windows 上开发（shell 工具/评测用例含 Windows 路径），
    # 换 Linux 需要额外适配，见 README 的"已知限制"
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 单元测试
        run: pytest -q

      - name: 确定性评测（不联网、零成本、秒级）
        run: python -m evals run --no-save
