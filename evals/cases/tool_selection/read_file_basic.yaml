id: read_file_basic
category: tool_selection
description: 用户要求读文件内容，应调用 read_file
setup_files:
  "notes.txt": "今天要买牛奶鸡蛋"
input: "读一下 notes.txt 的内容"
script:
  - tool_calls:
      - id: call_1
        type: function
        function:
          name: read_file
          arguments: '{"path": "notes.txt"}'
  - content: "文件内容是：今天要买牛奶鸡蛋"
graders:
  - type: tool_sequence
    expect: ["read_file"]
    mode: contains
  - type: tool_result_contains
    any_of: ["牛奶", "鸡蛋"]
  - type: no_tool_error
  - type: final_answer_contains
    any_of: ["牛奶", "鸡蛋"]
  - type: max_iterations
    value: 3
