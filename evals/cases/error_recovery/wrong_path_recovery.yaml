id: wrong_path_recovery
category: error_recovery
description: 用户给的路径不存在，但同名文件在别的目录，应通过 list 探索找到
setup_files:
  "data/real.txt": "会议要点：预算 50 万"
input: "读一下 data/notes.txt 的内容"
script:
  - tool_calls:
      - id: call_1
        type: function
        function:
          name: read_file
          arguments: '{"path": "data/notes.txt"}'
  - tool_calls:
      - id: call_2
        type: function
        function:
          name: list_files
          arguments: '{"path": "data"}'
  - tool_calls:
      - id: call_3
        type: function
        function:
          name: read_file
          arguments: '{"path": "data/real.txt"}'
  - content: "data/notes.txt 不存在，但 data/real.txt 的内容是：会议要点：预算 50 万"
graders:
  - type: tool_sequence
    expect: ["read_file", "list_files", "read_file"]
    mode: contains
  - type: recovered_after_error
    any_of: ["预算"]
  - type: tool_result_contains
    any_of: ["预算"]
  - type: final_answer_contains
    any_of: ["预算"]
  - type: max_iterations
    value: 6
