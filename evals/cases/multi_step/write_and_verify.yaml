id: write_and_verify
category: multi_step
description: 写文件后再读取校验（写 → 读 两步）
setup_files: {}
input: "把备注：周五聚餐写进 party.txt，写完确认一下内容"
script:
  - tool_calls:
      - id: call_1
        type: function
        function:
          name: write_file
          arguments: '{"path": "party.txt", "content": "备注：周五聚餐"}'
  - tool_calls:
      - id: call_2
        type: function
        function:
          name: read_file
          arguments: '{"path": "party.txt"}'
  - content: "已写入并确认：备注：周五聚餐"
graders:
  - type: tool_sequence
    expect: ["write_file", "read_file"]
    mode: contains
  - type: tool_result_contains
    any_of: ["周五", "聚餐"]
  - type: no_tool_error
  - type: final_answer_contains
    any_of: ["聚餐"]
  - type: max_iterations
    value: 4
