id: conditional_check
category: multi_step
description: 条件任务：文件不存在时如实告知，不能编造内容
setup_files: {}
input: "如果 config.ini 存在，读一下第一行；如果不存在，直接告诉我没有配置文件"
script:
  - tool_calls:
      - id: call_1
        type: function
        function:
          name: read_file
          arguments: '{"path": "config.ini"}'
  - content: "没有配置文件（config.ini 不存在）"
graders:
  - type: tool_sequence
    expect: ["read_file"]
    mode: contains
  - type: final_answer_contains
    any_of: ["没有", "不存在"]
  - type: max_iterations
    value: 4
